name: Integracion continua

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: global_invoice
          POSTGRES_USER: globalinvoice
          POSTGRES_PASSWORD: root1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U globalinvoice -d global_invoice"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v6

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verificar y construir backend
        working-directory: backend
        run: ./mvnw --batch-mode clean verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Ejecutar pruebas
        working-directory: frontend
        run: npm run test -- --watch=false

      - name: Construir frontend de produccion
        working-directory: frontend
        run: npm run build
